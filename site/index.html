<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fortune-sheet-vanilla · via esm.sh</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
        background: #f4f5f7;
      }
      header {
        padding: 14px 20px;
        background: #fff;
        border-bottom: 1px solid #e2e4e8;
      }
      header h1 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      header p {
        margin: 0;
        font-size: 13px;
        color: #666;
      }
      header code {
        background: #eef1f5;
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 12px;
      }
      #buttons {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      #buttons button {
        border: 1px solid #ccc;
        background: #fff;
        border-radius: 4px;
        padding: 5px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      #buttons button:hover {
        background: #eef3ff;
        border-color: #0188fb;
      }
      #status {
        margin-left: auto;
        font-size: 12px;
        color: #2e7d32;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #status .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2e7d32;
      }
      #sheet {
        position: absolute;
        top: 140px;
        left: 20px;
        right: 20px;
        bottom: 20px;
        border: 1px solid #d5d8dc;
        border-radius: 4px;
        overflow: hidden;
        background: #fff;
      }
      #status.error {
        color: #c62828;
      }
      #status.error .dot {
        background: #c62828;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>fortune-sheet-vanilla — loaded from esm.sh</h1>
      <p>
        No local files, no build step. Everything comes from
        <code>https://esm.sh/gh/Kreijstal/fortune-sheet-vanilla@990b773</code>:
      </p>
      <div id="buttons">
        <button id="btn-undo">Undo</button>
        <button id="btn-redo">Redo</button>
        <button id="btn-value">setCellValue(B2, 12345)</button>
        <button id="btn-sheet">Add sheet</button>
        <button id="btn-data">Log data</button>
        <span id="status"><span class="dot"></span> loading from esm.sh…</span>
      </div>
    </header>

    <div id="sheet"></div>

    <script type="module">
      import { FortuneSheet } from "https://esm.sh/gh/Kreijstal/fortune-sheet-vanilla@990b773";

      const status = document.getElementById("status");
      const setStatus = (text, error = false) => {
        status.lastChild.textContent = " " + text;
        status.classList.toggle("error", error);
      };

      const data = [
        {
          name: "esm.sh",
          color: "#0188fb",
          config: {
            merge: { "0_0": { r: 0, c: 0, rs: 1, cs: 6 } },
            columnlen: { 0: 130, 1: 110, 2: 110, 3: 110, 4: 110, 5: 110 },
          },
          celldata: [
            { r: 0, c: 0, v: { v: "fortune-sheet, straight from esm.sh", bl: 1, fs: 16 } },
            { r: 2, c: 0, v: { v: "Revenue", bl: 1 } },
            { r: 2, c: 1, v: { v: "Q1" } },
            { r: 2, c: 2, v: { v: "Q2" } },
            { r: 2, c: 3, v: { v: "Q3" } },
            { r: 2, c: 4, v: { v: "Q4" } },
            { r: 2, c: 5, v: { v: "Total" } },
            { r: 3, c: 1, v: { v: 1200, m: "1200" } },
            { r: 3, c: 2, v: { v: 1500, m: "1500" } },
            { r: 3, c: 3, v: { v: 1800, m: "1800" } },
            { r: 3, c: 4, v: { v: 2100, m: "2100" } },
            { r: 3, c: 5, v: { v: 6600, f: "=SUM(B4:E4)", m: "6600" } },
            { r: 4, c: 1, v: { v: 900, m: "900" } },
            { r: 4, c: 2, v: { v: 1100, m: "1100" } },
            { r: 4, c: 3, v: { v: 1300, m: "1300" } },
            { r: 4, c: 4, v: { v: 1600, m: "1600" } },
            { r: 4, c: 5, v: { v: 4900, f: "=SUM(B5:E5)", m: "4900" } },
            { r: 5, c: 0, v: { v: "Total", bl: 1, fs: 12 } },
            { r: 5, c: 5, v: { v: 11500, f: "=SUM(F4:F5)", m: "11500", bl: 1 } },
          ],
          row: 30,
          column: 10,
        },
      ];

      try {
        const sheet = new FortuneSheet(document.getElementById("sheet"), { data });
        document.getElementById("sheet").__sheet = sheet;
        setStatus("loaded — formulas, editing, undo/redo all live via esm.sh");
      } catch (e) {
        setStatus("failed: " + e.message, true);
        throw e;
      }

      document.getElementById("btn-undo").onclick = () => document.getElementById("sheet").__sheet.undo();
      document.getElementById("btn-redo").onclick = () => document.getElementById("sheet").__sheet.redo();
      document.getElementById("btn-value").onclick = () =>
        document.getElementById("sheet").__sheet.apiRef.setCellValue(1, 1, 12345);
      document.getElementById("btn-sheet").onclick = () =>
        document.getElementById("sheet").__sheet.apiRef.addSheet();
      document.getElementById("btn-data").onclick = () =>
        console.log(JSON.stringify(document.getElementById("sheet").__sheet.getData(), null, 2));
    </script>
  </body>
</html>
