name: Deploy site to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # esm.sh caches unpinned gh/ URLs, so pin the deployed site to this
      # commit's SHA to guarantee it serves the just-pushed code.
      - name: Pin esm.sh URL to this commit
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          sed -i -E "s|https://esm.sh/gh/Kreijstal/fortune-sheet-vanilla(@[a-f0-9]{7})?|https://esm.sh/gh/Kreijstal/fortune-sheet-vanilla|g" site/index.html|https://esm.sh/gh/Kreijstal/fortune-sheet-vanilla|https://esm.sh/gh/Kreijstal/fortune-sheet-vanilla@${SHORT}|g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
